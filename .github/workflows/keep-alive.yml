name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "Set the BACKEND_URL repository variable"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 90 "$BACKEND_URL/api/health"
